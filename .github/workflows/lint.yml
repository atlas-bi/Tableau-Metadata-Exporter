name: lint

on:
  push:
    branches: [dev, alpha, master]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup uv
      uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      with:
        python-version: '3.10'
        enable-cache: true

    - name: Install dependencies
      run: uv sync --frozen --no-build --group dev

    - name: Ruff check
      run: uv run --frozen --no-sync --no-build ruff check

    - name: Ruff format
      run: uv run --frozen --no-sync --no-build ruff format --check
